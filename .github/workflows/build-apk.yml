name: Build & Release Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper || gradle wrapper --gradle-version 8.9 || true
          fi
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Organize APK Output
        run: |
          mkdir -p .build-outputs
          APK_FOUND=$(find . -type f -name "*debug*.apk" -o -name "app-debug.apk" | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            APK_FOUND=$(find . -type f -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_FOUND" ]; then
            echo "::error::No APK found after build!"
            exit 1
          fi
          echo "Found APK at: $APK_FOUND"
          cp "$APK_FOUND" .build-outputs/app-debug.apk
          ls -lh .build-outputs/app-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: .build-outputs/app-debug.apk
          retention-days: 30

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: latest
          name: "Anjez AI - Latest Debug APK"
          body: |
            ### 🚀 Anjez AI (أنجز AI) - Debug Build
            - **Commit:** `${{ github.sha }}`
            - **Build Date:** `${{ github.event.head_commit.timestamp || 'Latest' }}`
            - **Download:** Direct link available via `app-debug.apk` below.
          draft: false
          prerelease: false
          make_latest: true
          files: .build-outputs/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
