name: Build & Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java Environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VERSION_STR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          MAJOR_VERSION=$(echo "$JAVA_VERSION_STR" | cut -d. -f1)
          echo "Detected Java Major Version: $MAJOR_VERSION"
          if [ -z "$MAJOR_VERSION" ] || [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java 17 or higher is required, but detected '$MAJOR_VERSION'."
            exit 1
          fi
          echo "Java version requirement satisfied."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Debug Keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "debug.keystore missing, generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already present."
          fi

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK Output
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$EXPECTED_APK" ] && [ -s "$EXPECTED_APK" ] && [[ "$EXPECTED_APK" == *.apk ]]; then
            echo "APK successfully verified at $EXPECTED_APK"
          else
            echo "::error::Expected APK file not found or empty at $EXPECTED_APK"
            echo "Searching only app/build/outputs/apk:"
            find app/build/outputs/apk -type f 2>/dev/null || true
            exit 1
          fi

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! command -v gh &> /dev/null; then
            echo "::error::GitHub CLI (gh) is not available."
            exit 1
          fi

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          echo "Publishing release $TAG_NAME..."
          gh release create "$TAG_NAME" "$APK_PATH" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --latest
